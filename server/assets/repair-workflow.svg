<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640"><rect width="1000" height="640" rx="24" fill="#102238"/><g font-family="sans-serif"><text x="60" y="70" fill="#ffb366" font-size="17" font-weight="bold">REFIX INDIA INSTITUTE / DIAGNOSIS WORKFLOW</text><text x="60" y="125" fill="white" font-size="34" font-weight="bold">Observe. Measure. Verify.</text><rect x="60" y="180" width="880" height="65" rx="12" fill="#213b56"/><text x="85" y="220" fill="white" font-size="22">01   Intake and consent - document the reported symptom</text><rect x="60" y="265" width="880" height="65" rx="12" fill="#213b56"/><text x="85" y="305" fill="white" font-size="22">02   Isolate power - follow battery and ESD procedures</text><rect x="60" y="350" width="880" height="65" rx="12" fill="#213b56"/><text x="85" y="390" fill="white" font-size="22">03   Inspect and plan - record evidence before rework</text><rect x="60" y="435" width="880" height="65" rx="12" fill="#213b56"/><text x="85" y="475" fill="white" font-size="22">04   Verify with your trainer - document the outcome</text><text x="60" y="585" fill="#bbcad9" font-size="16">Demo workflow. Use exact model documentation. Do not open mains power supplies.</text></g></svg>